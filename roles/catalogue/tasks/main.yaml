- name: app-setup for catalogue
  include_role:
    name: common
    tasks_from: app-setup

- name: nodejs setup for catalogue
  include_role: 
    name: common
    tasks_from: nodejs-setup
- name: systemd setup for catalogue
  include_role:
    name: common
    tasks_from: systemd
- name: copy mongo repo 
  ansible.builtin.copy:
    src: mongo.repo
    dest: /etc/yum.repos.d/mongo.repo

- name: install mongodb client 
  ansible.builtin.dnf:
    name: mongodb-mongosh
    state: present

- name: load data into mongodb  
  ansible.builtin.command: mongosh --host mongodb.devops26.sbs --eval 'db.getMongo().getDBNames().indexOf("catalogue")'
  register: shell_ouput

- name: print shell shell_ouput
  ansible.builtin.debug:
    msg: "{{ shell_ouput }}"
  
- name: load test data 
  ansible.builtin.shell: mongosh --host mongodb.devops26.sbs < /app/db/master-data.js
  when: shell_ouput.stdout | int < 0

- name: restart catalogue service
  ansible.builtin.service:
    name: catalogue
    state: restarted

- name: deploy catalogue 
  tags:
  - import
  include_role:
    name: common
    tasks_from: deployment